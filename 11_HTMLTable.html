<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Example</title>
</head>
<body>

<table border="1">

<caption><b>Student Report</b></caption>

<thead>

<tr>

<th>Roll No</th>

<th>Name</th>

<th>Marks</th>

</tr>

</thead>

<tbody>

<tr>

<td>1</td>

<td>pradnya</td>

<td>80</td>

</tr>

<tr>

<td>2</td>

<td>sayali</td>

<td>80</td>

</tr>

</tbody>

<tfoot>

<tr>

<td colspan="2">Total Students </td>
<td>2</td>

</tr>

</tfoot>

</table>


</body>
</html>
